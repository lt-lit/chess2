<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#2b2b2b" />
  <link rel="icon" href="data:," />
  <title>Chess Roguelike — Fairy-Stockfish playground</title>

  <!--
    coi-serviceworker must load first. GitHub Pages can't send the COOP/COEP
    headers that SharedArrayBuffer (and thus the Fairy-Stockfish WASM) needs,
    so this shim supplies them client-side. On first visit it auto-reloads the
    page once while the service worker installs.

    The shim file MUST live at the site root (next to index.html): a service
    worker can only control pages at or below its own path, so a vendored copy
    in a subdirectory would never control this page and would reload forever.
  -->
  <script>
    // Safety net: if isolation is somehow never achieved, stop after a few
    // reloads instead of looping. Reset the counter once isolated.
    if (window.crossOriginIsolated) sessionStorage.removeItem('coiReloads');
    window.coi = {
      doReload() {
        const n = +(sessionStorage.getItem('coiReloads') || 0);
        if (n < 3) { sessionStorage.setItem('coiReloads', String(n + 1)); location.reload(); }
        else { console.warn('coi-serviceworker: stopped reloading after 3 attempts without isolation'); }
      },
    };
  </script>
  <script src="coi-serviceworker.min.js"></script>

  <!--
    Cache-busting: GitHub Pages serves assets with a 10-minute cache, so after a
    deploy a browser can run a stale app module against a fresh index.html. The
    ?v=N query on our own changed assets (app.css, main.js, and main.js's local
    imports) forces a refetch. Bump N whenever those app files change. Vendor
    files and pieces.css are left unversioned — they rarely change and are large.
  -->
  <link rel="stylesheet" href="vendor/chessgroundx/assets/chessground.base.css" />
  <link rel="stylesheet" href="vendor/chessgroundx/assets/chessground.brown.css" />
  <link rel="stylesheet" href="css/pieces.css" />
  <link rel="stylesheet" href="css/app.css?v=2" />
</head>
<body>
  <main>
    <h1>Fairy-Stockfish playground</h1>
    <p class="sub">Pick a variant, dial the strength, and watch the engine think.</p>

    <!-- The cg-wrap class on the column lets the cburnett piece images (scoped
         to .cg-wrap in pieces.css) reach the pocket pieces, which live in these
         host divs rather than inside the board element. -->
    <div id="board-col" class="cg-wrap">
      <div id="pocket-top"></div>
      <div id="board"></div>
      <div id="pocket-bottom"></div>
    </div>

    <p id="status" class="status">Loading…</p>
    <div id="lines" class="lines"></div>

    <div class="controls">
      <label>Variant
        <select id="variant"></select>
      </label>
      <label>You play
        <select id="side">
          <option value="white" selected>White</option>
          <option value="black">Black</option>
        </select>
      </label>
    </div>

    <div class="controls">
      <label>Strength
        <select id="strength">
          <option value="full" selected>Full strength</option>
          <option value="skill:0">Skill 0 (weakest)</option>
          <option value="skill:3">Skill 3</option>
          <option value="skill:6">Skill 6</option>
          <option value="skill:10">Skill 10</option>
          <option value="skill:15">Skill 15</option>
          <option value="elo:800">~800 Elo</option>
          <option value="elo:1200">~1200 Elo</option>
          <option value="elo:1600">~1600 Elo</option>
          <option value="elo:2000">~2000 Elo</option>
          <option value="elo:2400">~2400 Elo</option>
        </select>
      </label>
      <label>Think
        <select id="limit">
          <option value="depth:8">Depth 8 (fast)</option>
          <option value="depth:10">Depth 10</option>
          <option value="depth:12" selected>Depth 12</option>
          <option value="depth:14">Depth 14</option>
          <option value="depth:16">Depth 16 (slow)</option>
          <option value="movetime:200">200 ms / move</option>
          <option value="movetime:500">500 ms / move</option>
          <option value="movetime:1000">1 s / move</option>
          <option value="nodes:50000">50k nodes</option>
        </select>
      </label>
      <label>Lines
        <select id="multipv">
          <option value="1" selected>1 (best only)</option>
          <option value="3">Top 3</option>
          <option value="5">Top 5</option>
        </select>
      </label>
      <button id="new-game">New game</button>
    </div>

    <div id="promo" class="promo hidden"></div>

    <p class="credit">
      Engine: <a href="https://github.com/fairy-stockfish/fairy-stockfish.wasm">Fairy-Stockfish</a> ·
      Board: <a href="https://github.com/gbtami/chessgroundx">chessgroundx</a> ·
      Pieces: cburnett (lichess, GPL)
    </p>
  </main>

  <script type="module" src="src/main.js?v=2"></script>
</body>
</html>
